
name: SAM.AI Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract SAM.AI project
        shell: bash
        run: |
          set -euo pipefail
          unzip -q SAM_AI_Flutter_NoError.zip -d /tmp/sam-ai

          PROJECT_PUBSPEC="$(find /tmp/sam-ai -name pubspec.yaml -type f -print -quit)"

          if [ -z "$PROJECT_PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found in ZIP"
            find /tmp/sam-ai -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_PUBSPEC")"
          cp -R "$PROJECT_DIR"/. .

      - name: Generate Android project
        run: flutter create . --platforms=android

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SAM-AI-APK
          path: build/app/outputs/flutter-apk/app-release.apk
